<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="quiz-container">
        <h1 id="quiz-title">Quiz</h1>
        
        <div id="question-area" class="question-box">
            <p id="question-text">Loading question...</p>
        </div>

        <div id="answer-buttons" class="btn-grid">
            <button class="btn">Answer A</button>
            <button class="btn">Answer B</button>
            <button class="btn">Answer C</button>
            <button class="btn">Answer D</button>
        </div>
        <p id="feedback-text"></p>
        <p id="score-text">Score: 0</p>
    </div>

    <script type="module" src="./dist/app.js"></script>
</body>
</html>
